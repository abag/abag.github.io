# baseURL is overridden by the GitHub Actions workflow, so this works for
# username.github.io and for project pages (username.github.io/repo/) alike.
baseURL = "https://abag.github.io/"
locale = "en-gb"
title = "Andrew Baggaley"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Andrew Baggaley: Professor of Mathematics and AI at Lancaster University, working on quantum fluids and turbulence and on mathematical biology, especially the spread of plant disease."
  role = "Professor of Mathematics and AI"
  email_user = "a.baggaley1"
  email_domain = "lancaster.ac.uk"
  phone = "+44 (0)1524 593960"
  address = ["School of Mathematical Sciences", "Lancaster University", "Lancaster LA1 4YF", "United Kingdom"]
  orcid = "https://orcid.org/0000-0002-6813-2443"
  scholar = "https://scholar.google.com/citations?user=F827L80AAAAJ"
  github = "https://github.com/abag"
  # "Last updated" in the footer is set from the latest commit by the deploy workflow (today's date locally).
  # GoatCounter visitor statistics, dashboard at https://abaggaley.goatcounter.com. Leave empty to turn off.
  # The standalone static/condensate/index.html has its own copy of the snippet.
  goatcounter = "abaggaley"

[markup.goldmark.renderer]
  unsafe = true

[menus]
  [[menus.main]]
    name = "Research"
    pageRef = "/research"
    weight = 1
  [[menus.main]]
    name = "Publications"
    pageRef = "/publications"
    weight = 2
  [[menus.main]]
    name = "News"
    pageRef = "/news"
    weight = 3
  [[menus.main]]
    name = "Teaching"
    pageRef = "/teaching"
    weight = 4
  [[menus.main]]
    name = "Bio"
    pageRef = "/bio"
    weight = 5
  # A standalone page in static/condensate/, not a Hugo page, so it uses url rather than pageRef.
  [[menus.main]]
    name = "Condensate"
    url = "condensate/"
    weight = 6
