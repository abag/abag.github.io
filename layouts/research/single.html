{{ define "main" }}
<article class="wrap page research-page" data-theme="{{ .Params.theme }}">
  <p class="crumb"><a href="{{ "research/" | relURL }}">Research</a></p>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <h2>Publications in this theme</h2>
  <ul class="pubs">
  {{ range where hugo.Data.publications "theme" .Params.theme }}{{ partial "pub.html" . }}{{ end }}
  </ul>
</article>
{{ end }}
