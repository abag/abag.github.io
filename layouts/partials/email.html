{{- /* Email assembled by JavaScript to keep it away from simple scrapers. */ -}}
<span class="email" data-u="{{ site.Params.email_user }}" data-d="{{ site.Params.email_domain }}"><noscript>{{ replace site.Params.email_user "." " (dot) " }} (at) {{ replace site.Params.email_domain "." " (dot) " }}</noscript></span><button class="copy-email" type="button" hidden>Copy</button>
